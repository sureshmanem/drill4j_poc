# Drill4J PoC — full stack running under Podman.
#
#   postgres     : backing store for the admin backend (pre-seeded with an API key)
#   drill-admin  : Drill4J admin backend / REST API (port 8090)
#   drill-ui     : Drill4J web UI (port 8091)
#   agent-files  : one-shot job that drops the native Java agent into a shared volume
#   sample-app   : our Spring Boot app, started with the agent attached
#
# Bring it up with:  ./scripts/up.sh   (or: podman-compose up -d --build)

services:

  postgres:
    image: postgres:17.0
    platform: ${DRILL_PLATFORM}
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - ./docker/db-init:/docker-entrypoint-initdb.d:ro
      - drill-data-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 10

  drill-admin:
    image: ghcr.io/drill4j/admin:${DRILL_ADMIN_BACKEND_VERSION}
    platform: ${DRILL_PLATFORM}
    environment:
      - DRILL_DB_HOST=${POSTGRES_HOST}
      - DRILL_DB_PORT=5432
      - DRILL_DB_NAME=${POSTGRES_DB}
      - DRILL_DB_USER_NAME=${POSTGRES_USER}
      - DRILL_DB_PASSWORD=${POSTGRES_PASSWORD}
      - DRILL_DB_MAX_POOL_SIZE=${DRILL_ADMIN_BACKEND_DB_MAX_POOL_SIZE}
      - DRILL_AGENTS_SOCKET_TIMEOUT=6000
      - DRILL_SCHEDULER_REFRESH_VIEWS_INTERVAL_IN_MINUTES=1
      - LOG_LEVEL=info
    ports:
      - "${DRILL_ADMIN_PORT}:8090"
    depends_on:
      postgres:
        condition: service_healthy

  drill-ui:
    image: ghcr.io/drill4j/drill4j-ui:${DRILL_UI_VERSION}
    platform: ${DRILL_PLATFORM}
    environment:
      API_HOST: drill-admin
      API_PORT: 8090
    ports:
      - "${DRILL_UI_PORT}:8080"
    depends_on:
      - drill-admin

  # Populates the shared "agent-files" volume with libdrill_agent.so, then exits.
  agent-files:
    image: drill4j/java-agent:${JAVA_AGENT_VERSION}
    platform: ${DRILL_PLATFORM}
    environment:
      - AGENT_VERSION=${JAVA_AGENT_VERSION}
    volumes:
      - agent-files:/data
    healthcheck:
      test: ["CMD", "sh", "-c", "test -f /data/agent/libdrill_agent.so || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 5s

  sample-app:
    build:
      context: ./sample-app
    image: drill4j-sample-app:local
    platform: ${DRILL_PLATFORM}
    environment:
      # Attach the Drill4J native agent from the shared volume.
      - JAVA_TOOL_OPTIONS=-agentpath:/data/agent/libdrill_agent.so
      - DRILL_API_URL=http://drill-admin:8090/api
      - DRILL_API_KEY=${DRILL_API_KEY}
      - DRILL_APP_ID=${DRILL_APP_ID}
      - DRILL_GROUP_ID=${DRILL_GROUP_ID}
      - DRILL_BUILD_VERSION=${DRILL_BUILD_VERSION}
      - DRILL_ENV_ID=${DRILL_ENV_ID}
      - DRILL_PACKAGE_PREFIXES=${DRILL_PACKAGE_PREFIXES}
    ports:
      - "${SAMPLE_APP_PORT}:8080"
    volumes:
      - agent-files:/data:ro
    depends_on:
      agent-files:
        condition: service_healthy
      drill-admin:
        condition: service_started

volumes:
  drill-data-pg:
  agent-files:
